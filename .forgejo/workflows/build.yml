# Baut das Kiosk-Netboot-Image und haengt die Boot-Dateien bei einem Tag als
# Release-Assets an. Ein 3rd-party-Dienst zieht sie von dort.
#
# Laeuft auf einem selbst gehosteten act_runner mit dem Label `archiso`, der als
# root im host-Executor arbeitet (mkarchiso braucht root und mountet
# /proc, /sys, /dev - das geht nicht im Container). Der Runner braucht:
#   mkarchiso, arch-install-scripts, cargo/rust, git, curl, jq.
#
# Voraussetzung fuer den recursive Checkout: das Submodule miniclientcontrol
# liegt auf DERSELBEN Forgejo-Instanz wie dieses Repo, dann reicht der
# automatische Job-Token. (git submodule set-url + .gitmodules anpassen.)

name: build
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  image:
    runs-on: archiso
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
    steps:
      # Hauptrepo mit dem automatischen Job-Token. Submodule NICHT hier, weil
      # der Token nur dieses Repo darf - miniclientcontrol liegt in einem
      # anderen (privaten) Repo.
      - uses: actions/checkout@v4

      # Submodule miniclientcontrol ueber einen read-only Deploy-Key holen
      # (Secret SUBMODULE_SSH_KEY; oeffentlicher Teil liegt als Deploy-Key im
      # miniclientcontrol-Repo). .gitmodules zeigt dafuer auf die ssh-URL.
      - name: fetch submodule (deploy key)
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}
        run: |
          key="$RUNNER_TEMP/submodule_key"
          install -m600 /dev/null "$key"
          printf '%s\n' "$SUBMODULE_SSH_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: cache cargo
        uses: actions/cache@v4
        with:
          key: cargo-${{ hashFiles('miniclientcontrol/Cargo.lock') }}
          restore-keys: cargo-
          path: |
            .cargo/registry
            miniclientcontrol/target

      - name: build netboot image
        run: ./build.sh
        env:
          BUILDMODE: netboot

      - name: upload workflow artifacts
        uses: actions/upload-artifact@v3
        with:
          name: kiosk-netboot
          path: |
            out/arch/boot/x86_64/vmlinuz-linux
            out/arch/boot/x86_64/initramfs-linux.img
            out/arch/x86_64/airootfs.sfs
            out/arch/x86_64/airootfs.sha512

      - name: publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: ./ci/release.sh
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
