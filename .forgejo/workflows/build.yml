# Baut das Kiosk-Netboot-Image. Bei einem Tag v* haengen die Boot-Dateien als
# Assets am GitHub-Release (ci/github-release.sh) und am Forgejo-Release
# (ci/release.sh). Ausgerollt wird, indem k8s-flux den Tag im
# netbootxyz-Deployment pinnt; dessen initContainer laedt vom GitHub-Release.
#
# Laeuft auf einem selbst gehosteten act_runner mit dem Label `archiso`, der als
# root im host-Executor arbeitet (mkarchiso braucht root und mountet
# /proc, /sys, /dev - das geht nicht im Container). Der Runner braucht:
#   mkarchiso, arch-install-scripts, cargo/rust, git, curl, jq.
#
# .gitmodules nennt das Submodule relativ (../miniclientcontrol.git), damit
# derselbe Stand auf Forgejo und auf dem GitHub-Mirror klont.
#
# Secrets: SUBMODULE_SSH_KEY (Deploy-Key am miniclientcontrol-Repo im Forgejo),
# CASTTARGET_SSH_KEY (Deploy-Key am casttarget-Repo auf git.fablab-luebeck.de -
# casttarget ist ein geschachteltes Submodule von miniclientcontrol auf einem
# anderen Host), GH_RELEASE_TOKEN (fine-grained PAT auf den GitHub-Mirror,
# Contents read/write) fuer die GitHub-Release-Assets.

name: build
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  image:
    runs-on: archiso
    env:
      # Cargo-Stand fest auf dem Runner statt im Workspace: der Workspace-Pfad
      # (/root/.cache/act/<hash>/...) ist pro Lauf neu, und Cargo fingerprintet
      # Dependencies ueber ihren absoluten Quellpfad - mit CARGO_HOME im
      # Workspace wurden trotz Cache-Hit jedes Mal alle ~230 Crates neu gebaut
      # (7 min). Runner hat Kapazitaet 1; parallel wuerde Cargo per Lock warten.
      CARGO_HOME: /var/cache/kiosk-ci/cargo
      CARGO_TARGET_DIR: /var/cache/kiosk-ci/target
      CARGO_BUILD_JOBS: "2"   # VM hat wenig RAM; weniger parallele rustc = kleinerer Peak
    steps:
      # Hauptrepo mit dem automatischen Job-Token. Submodule NICHT hier, weil
      # der Token nur dieses Repo darf - miniclientcontrol liegt in einem
      # anderen (privaten) Repo.
      - uses: actions/checkout@v4

      # Submodule rekursiv holen. Zwei read-only Deploy-Keys, per-Host zugeordnet
      # ueber eine ssh-config:
      #   - miniclientcontrol liegt im Forgejo (relative URL aus .gitmodules;
      #     insteadOf biegt die https-URL des Checkouts auf ssh um) -> der
      #     Forgejo-Host faellt unter "Host *" und nimmt SUBMODULE_SSH_KEY;
      #   - casttarget ist ein geschachteltes Submodule von miniclientcontrol auf
      #     git.fablab-luebeck.de -> eigener Host-Block mit CASTTARGET_SSH_KEY.
      - name: fetch submodules (deploy keys)
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}
          CASTTARGET_SSH_KEY: ${{ secrets.CASTTARGET_SSH_KEY }}
        run: |
          mckey="$RUNNER_TEMP/submodule_key"
          ctkey="$RUNNER_TEMP/casttarget_key"
          install -m600 /dev/null "$mckey"
          install -m600 /dev/null "$ctkey"
          printf '%s\n' "$SUBMODULE_SSH_KEY" > "$mckey"
          printf '%s\n' "$CASTTARGET_SSH_KEY" > "$ctkey"
          cfg="$RUNNER_TEMP/ssh_config"
          {
            printf 'Host git.fablab-luebeck.de\n'
            printf '    IdentityFile %s\n    IdentitiesOnly yes\n    StrictHostKeyChecking accept-new\n' "$ctkey"
            printf 'Host *\n'
            printf '    IdentityFile %s\n    IdentitiesOnly yes\n    StrictHostKeyChecking accept-new\n' "$mckey"
          } > "$cfg"
          chmod 600 "$cfg"
          export GIT_SSH_COMMAND="ssh -F $cfg"
          git submodule sync --recursive
          git -c url."ssh://git@${GITHUB_SERVER_URL#https://}/".insteadOf="${GITHUB_SERVER_URL}/" \
            submodule update --init --recursive --depth 1

      - name: build netboot image
        run: ./build.sh
        env:
          BUILDMODE: netboot
          # Bei einem Tag genau der Tag; sonst leer, dann nimmt build.sh
          # git describe (der flache Checkout hat keine Tags: ein Commit-SHA).
          KIOSK_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - name: publish github release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: ./ci/github-release.sh
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GH_REPO: philippderdiedas/clientcontrol-linux
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}

      - name: publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: ./ci/release.sh
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
