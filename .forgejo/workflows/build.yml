# Baut das Kiosk-Netboot-Image. Bei einem Tag v* haengen die Boot-Dateien als
# Assets am GitHub-Release (ci/github-release.sh) und am Forgejo-Release
# (ci/release.sh). Ausgerollt wird, indem k8s-flux den Tag im
# netbootxyz-Deployment pinnt; dessen initContainer laedt vom GitHub-Release.
#
# Laeuft auf einem selbst gehosteten act_runner mit dem Label `archiso`, der als
# root im host-Executor arbeitet (mkarchiso braucht root und mountet
# /proc, /sys, /dev - das geht nicht im Container). Der Runner braucht:
#   mkarchiso, arch-install-scripts, cargo/rust, git, curl, jq.
#
# .gitmodules nennt das Submodule relativ (../miniclientcontrol.git), damit
# derselbe Stand auf Forgejo und auf dem GitHub-Mirror klont.
#
# Secrets: SUBMODULE_SSH_KEY (s.u.), GH_RELEASE_TOKEN (fine-grained PAT auf
# den GitHub-Mirror, Contents read/write) fuer die GitHub-Release-Assets.

name: build
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  image:
    runs-on: archiso
    env:
      # Cargo-Stand fest auf dem Runner statt im Workspace: der Workspace-Pfad
      # (/root/.cache/act/<hash>/...) ist pro Lauf neu, und Cargo fingerprintet
      # Dependencies ueber ihren absoluten Quellpfad - mit CARGO_HOME im
      # Workspace wurden trotz Cache-Hit jedes Mal alle ~230 Crates neu gebaut
      # (7 min). Runner hat Kapazitaet 1; parallel wuerde Cargo per Lock warten.
      CARGO_HOME: /var/cache/kiosk-ci/cargo
      CARGO_TARGET_DIR: /var/cache/kiosk-ci/target
      CARGO_BUILD_JOBS: "2"   # VM hat wenig RAM; weniger parallele rustc = kleinerer Peak
    steps:
      # Hauptrepo mit dem automatischen Job-Token. Submodule NICHT hier, weil
      # der Token nur dieses Repo darf - miniclientcontrol liegt in einem
      # anderen (privaten) Repo.
      - uses: actions/checkout@v4

      # Submodule miniclientcontrol ueber einen read-only Deploy-Key holen
      # (Secret SUBMODULE_SSH_KEY; oeffentlicher Teil liegt als Deploy-Key im
      # miniclientcontrol-Repo). Die relative URL aus .gitmodules loest gegen
      # die https-URL des Checkouts auf; insteadOf biegt sie auf ssh um.
      - name: fetch submodule (deploy key)
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}
        run: |
          key="$RUNNER_TEMP/submodule_key"
          install -m600 /dev/null "$key"
          printf '%s\n' "$SUBMODULE_SSH_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git submodule sync --recursive
          git -c url."ssh://git@${GITHUB_SERVER_URL#https://}/".insteadOf="${GITHUB_SERVER_URL}/" \
            submodule update --init --recursive --depth 1

      - name: build netboot image
        run: ./build.sh
        env:
          BUILDMODE: netboot
          # Bei einem Tag genau der Tag; sonst leer, dann nimmt build.sh
          # git describe (der flache Checkout hat keine Tags: ein Commit-SHA).
          KIOSK_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - name: publish github release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: ./ci/github-release.sh
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GH_REPO: philippderdiedas/clientcontrol-linux
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}

      - name: publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: ./ci/release.sh
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
